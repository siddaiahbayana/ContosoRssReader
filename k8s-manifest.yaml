# --- BACKEND API DEPLOYMENT & SERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-rss-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contoso-rss-api
  template:
    metadata:
      labels:
        app: contoso-rss-api
    spec:
      containers:
      - name: api
        image: contoso-rss-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: contoso-rss-api-service
spec:
  type: ClusterIP
  selector:
    app: contoso-rss-api
  ports:
  - port: 8080
    targetPort: 8080

---
# --- FRONTEND UI DEPLOYMENT & SERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-rss-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contoso-rss-ui
  template:
    metadata:
      labels:
        app: contoso-rss-ui
    spec:
      containers:
      - name: ui
        image: contoso-rss-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: contoso-rss-ui-service
spec:
  type: ClusterIP
  selector:
    app: contoso-rss-ui
  ports:
  - port: 80
    targetPort: 80

